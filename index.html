<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="myICDCode" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary SEO -->
    <title>myICDCode.com — ICD-10-CM Code Lookup, Plain English</title>
    <meta name="description" content="Free ICD-10-CM diagnosis code lookup. Search 98,000+ codes with plain English explanations. FY 2026 current — updated annually from CMS and CDC." />
    <meta name="keywords" content="ICD-10, ICD-10-CM, ICD 10 codes, diagnosis codes, medical codes, ICD code lookup, medical billing codes, ICD-10 code search, what does ICD code mean, EOB diagnosis code" />
    <meta name="author" content="StormGlass Interactive Inc." />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://myicdcode.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://myicdcode.com/" />
    <meta property="og:site_name" content="myICDCode.com" />
    <meta property="og:title" content="myICDCode.com — ICD-10-CM Code Lookup, Plain English" />
    <meta property="og:description" content="Search 98,000+ ICD-10-CM diagnosis codes explained in plain English. Free, fast, FY 2026 current." />
    <meta property="og:image" content="https://myicdcode.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@myICDCode" />
    <meta name="twitter:title" content="myICDCode.com — ICD-10 Code Lookup" />
    <meta name="twitter:description" content="Search 98,000+ ICD-10-CM diagnosis codes in plain English. Free, FY 2026 current." />
    <meta name="twitter:image" content="https://myicdcode.com/og-image.png" />

    <!-- Mobile / PWA -->
    <meta name="theme-color" content="#0A1628" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="myICDCode" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- JSON-LD: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "myICDCode.com",
      "alternateName": "myICDCode",
      "url": "https://myicdcode.com",
      "description": "Free ICD-10-CM diagnosis code lookup with plain English explanations. 98,000+ codes, FY 2026 current.",
      "inLanguage": "en-US",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://myicdcode.com/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      },
      "publisher": {
        "@type": "Organization",
        "name": "StormGlass Interactive Inc.",
        "url": "https://stormglassinteractive.com",
        "email": "support@stormglassinteractive.com"
      }
    }
    </script>

    <!-- JSON-LD: MedicalWebPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalWebPage",
      "name": "ICD-10-CM Code Lookup",
      "url": "https://myicdcode.com",
      "description": "Lookup and understand ICD-10-CM medical diagnosis codes in plain English.",
      "medicalAudience": [
        { "@type": "MedicalAudience", "audienceType": "Patient" },
        { "@type": "MedicalAudience", "audienceType": "Clinician" }
      ],
      "about": {
        "@type": "MedicalCode",
        "codeSystem": "ICD-10-CM"
      }
    }
    </script>

    <!-- Theme init — runs before React to prevent flash -->
    <script>
      (function() {
        var t = localStorage.getItem('myicdcode-theme') || 'navy';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>

    <!-- Google Analytics GA4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-H19C2ZC6XC"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-H19C2ZC6XC');
    </script>

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7937609722850741" crossorigin="anonymous"></script>

  </head>
  <body style="background:#0A1628;color:#F0F4FF;margin:0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .catch(() => {});
      });
    }
  </script>
  </body>
</html>
